line-length = 120
target-version = "py313"
exclude = [".venv"]

[lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG",
    "PTH", "PL", "PERF", "RUF", "PT", "S", "T20", "ANN", "D", "TID", "ERA",
]
ignore = ["D100", "D104", "D203", "D213", "ANN401"]

[lint.per-file-ignores]
"tests/**" = ["S101", "D103", "PLR2004"]

[lint.pydocstyle]
convention = "google"

[lint.flake8-pytest-style]
fixture-parentheses = false
parametrize-names-type = "tuple"
